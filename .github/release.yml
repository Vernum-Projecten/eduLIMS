#
# Configuration for GitHub's generated release notes. The categories map to
# the pull request labels. CHANGELOG.md, assembled from changelog.d/, stays
# the primary record, and the release workflow writes the notes from its
# section; these categories serve "Generate release notes" in the web UI and
# `gh release create --generate-notes`.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - ignore-for-release
      - no-changelog
  categories:
    - title: Security
      labels:
        - security
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - chore
        - refactor
        - perf
        - ci
        - test
        - dependencies
    - title: Other changes
      labels:
        - "*"
