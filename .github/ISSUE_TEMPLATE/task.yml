name: Task
description: Plan work with no new behaviour (docs, CI, refactoring, tests, maintenance).
type: Task
body:
  - type: markdown
    attributes:
      value: |
        The type is already Task. Add exactly one work-kind label
        (documentation, chore, refactor, perf, test, ci): it picks the branch
        prefix and the commit type.
  - type: dropdown
    id: requirement
    attributes:
      label: Requirement
      description: The requirement this task supports, if any.
      options:
        - "S1: Sign in with the institution account (Entra ID or Keycloak)"
        - "S4: Upload the Gen5 Excel export of the Epoch 2"
        - "S5: See the measurements per sample (Afinion, Epoch)"
        - "S10: Work in a team"
        - "S11: Register a patient from the request form"
        - "S12: Record a request with its tests and samples"
        - "S13: Set the team's own tolerances per test"
        - "S14: Measure a sample again"
        - "S15: Release a result to the patient's record"
        - "D9: Manage the test catalogue"
        - "D10: Prepare a game and its correct values"
        - "D11: Follow every team live on the dashboard"
        - "D12: Set a time target for urgent requests"
        - "D13: Set the accuracy limits per test"
        - "D14: See the ranking of the teams"
        - "B1: Manage users and roles"
        - "B2: Manage classes"
        - "B3: Manage analysers and integrations"
        - "B4: View the log of uploads, HL7 messages and errors"
        - "Quality requirement (ISO 25010: security, privacy, accessibility, ...)"
        - "None: no requirement covers this"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the task changes, and why it is needed now.
    validations:
      required: true
  - type: textarea
    id: criterion
    attributes:
      label: Acceptance criterion
      description: How a reviewer sees the task is done.
      placeholder: CI runs the e2e lane on every pull request and the axe scan finds no level A or AA violation.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, constraints, or the order this task has to happen in.
    validations:
      required: false
