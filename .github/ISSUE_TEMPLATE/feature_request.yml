name: Feature request
description: Propose a user story for a requirement, or a new capability.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        The type is already Feature, and a maintainer sets the priority and
        the MoSCoW label during triage.
  - type: dropdown
    id: requirement
    attributes:
      label: Requirement
      description: The requirement in docs/requirements.md this story delivers.
      options:
        - "S1: Sign in with the institution account (Entra ID or Keycloak)"
        - "S4: Upload the Gen5 Excel export of the Epoch 2"
        - "S5: See the measurements per sample (Afinion, Epoch)"
        - "S10: Work in a lab"
        - "S11: Register a patient from the request form"
        - "S12: Record a request with its tests and samples"
        - "S13: Set the team's own tolerances per test"
        - "S14: Measure a sample again"
        - "S15: Release a result to the patient's record"
        - "D9: Manage the test catalogue"
        - "D10: Prepare a simulation with its labs and correct values"
        - "D11: Follow every team live on the dashboard"
        - "D12: Set a time target for urgent requests"
        - "D13: Set the accuracy limits per test"
        - "D14: See the ranking of the teams"
        - "B1: Manage users and roles"
        - "B3: Manage analysers and integrations"
        - "B4: View the log of uploads, HL7 messages and errors"
        - "Quality requirement (ISO 25010: security, privacy, accessibility, ...)"
        - "None: a new requirement (say so below)"
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Who wants what, and why.
      placeholder: As a teacher, I want to see every measurement of a requested test, so that I can follow the simulation.
    validations:
      required: true
  - type: textarea
    id: criterion
    attributes:
      label: Acceptance criterion
      description: >-
        The test that shows the story is done, as concrete as the requirements
        analysis states it (a number, a time limit, a role that may or may not
        see something).
      placeholder: A released result shows on the dashboard without a manual reload, with its status as a colour with an icon and text.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.
    validations:
      required: false
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy and accessibility
      description: >-
        Does the story touch personal data, a role boundary, or a screen that
        must meet WCAG 2.1 AA? Name what a reviewer has to check.
    validations:
      required: false
