name: Bug report
description: Report a defect in eduLIMS.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The type is already Bug, and a maintainer
        sets the priority during triage.

        Do not use this form for a security vulnerability: report it privately
        through the Security tab. Do not paste real personal data (names,
        student numbers) or anything from a real game (a scenario, a correct
        value); use the pseudonymised test set.
  - type: dropdown
    id: requirement
    attributes:
      label: Requirement
      description: The requirement in docs/requirements.md whose behaviour is wrong.
      options:
        - "S1: Sign in with the institution account (Entra ID or Keycloak)"
        - "S4: Upload the Gen5 Excel export of the Epoch 2"
        - "S5: See the measurements per sample (Afinion, Epoch)"
        - "S10: Work in a team"
        - "S11: Register a patient from the request form"
        - "S12: Record a request with its tests and samples"
        - "S13: Set the team's own tolerances per test"
        - "S14: Measure a sample again"
        - "S15: Release a result to the patient's record"
        - "D9: Manage the test catalogue"
        - "D10: Prepare a game and its correct values"
        - "D11: Follow every team live on the dashboard"
        - "D12: Set a time target for urgent requests"
        - "D13: Set the accuracy limits per test"
        - "D14: See the ranking of the teams"
        - "B1: Manage users and roles"
        - "B2: Manage classes"
        - "B3: Manage analysers and integrations"
        - "B4: View the log of uploads, HL7 messages and errors"
        - "Quality requirement (ISO 25010: security, privacy, accessibility, ...)"
        - "None: no requirement covers this"
    validations:
      required: true
  - type: textarea
    id: criterion
    attributes:
      label: Acceptance criterion that fails
      description: The acceptance criterion of that requirement the bug breaks, quoted or in your words.
      placeholder: An Excel file in another layout than the Gen5 export is refused with a clear error message.
    validations:
      required: true
  - type: dropdown
    id: portal
    attributes:
      label: Portal
      options:
        - Student portal
        - Teacher portal
        - Admin portal
        - An integration (FerroEHR, FerroBRIDGE)
        - Not portal-specific
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug, starting from sign-in.
      placeholder: |
        1. Sign in as a student
        2. Open the request ...
        3. Upload ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead. Include the error message shown.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag or commit SHA of the environment you used.
      placeholder: v0.1.0, or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - Test environment
        - Production
    validations:
      required: true
