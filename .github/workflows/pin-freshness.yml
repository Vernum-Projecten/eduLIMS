# The freshness half of the pin discipline (our own design, ported from the
# Ferro family). Dependabot moves the `uses:` references, the npm packages
# and the docker/ base images. scripts/checks/pin-freshness.sh reads the pins
# it does not (Node.js, pnpm, the PostgreSQL service image, actionlint,
# zizmor, shellcheck) and this workflow opens one issue when one is behind.
# The vendored-owasp job re-fetches the OWASP trees under docs/security/vendor/
# at their pins and opens one issue when a tree or a tag drifted. The
# template-opt job rebuilds the eduLIMS-lab OPT from the CKM archetypes it pins.
#
# The first two jobs open an issue and do not fail: a weekly red job trains a
# maintainer to ignore red jobs, and a newer upstream release is not a broken
# build. template-opt opens an issue and fails, for the reason on the job.
name: Pin freshness

on:
  schedule:
    # Mondays 06:17 UTC: off the hour and after the weekly Dependabot run.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  freshness:
    name: pin freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every unwatched pin with its newest upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          bash scripts/checks/pin-freshness.sh > freshness.txt || status=$?
          cat freshness.txt
          # 0 every pin current, 1 at least one behind, 2 a release could not
          # be read. Only 1 opens an issue; 2 fails the job, because a pin
          # that could not be compared is not a pin known to be fresh.
          if [ "$status" -eq 2 ]; then
            echo "a release could not be read; the comparison is incomplete" >&2
            exit 1
          fi
          echo "stale=$([ "$status" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Open an issue when a pin is behind
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: A tool or runtime pin is behind its newest upstream release
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          open="$(gh issue list --state open --limit 500 --json title \
            --jq "[.[] | select(.title == \"$TITLE\")] | length")"
          if [ "$open" -ne 0 ]; then
            echo "an open issue already carries this report; not opening a second"
            exit 0
          fi
          {
            echo "\`scripts/checks/pin-freshness.sh\` found a pin behind its newest upstream release."
            echo
            echo "Move the pin in the file the line names, and re-run CI."
            echo
            echo '```text'
            cat freshness.txt
            echo '```'
            echo
            echo "Reported by [this run]($RUN_URL)."
          } > body.md
          # fields.sh files the issue as a Task at Low priority and effort. The
          # default token may not read the organisation's issue types; then
          # the issue lands with its labels alone and triage sets the three.
          bash scripts/gh/fields.sh new task low low \
            --title "$TITLE" --body-file body.md --label ci --label dependencies

  # The vendored OWASP trees (docs/security/vendor/) against their pins: each
  # scripts/vendor/owasp-*.sh --check re-fetches its files at the pinned
  # commit, verifies every sha256, diffs the committed tree, and checks that
  # the pinned tag still names the pinned commit. It needs the network, so it
  # runs here and not on every pull request.
  vendored-owasp:
    name: vendored OWASP copies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Re-fetch every vendored OWASP tree and diff it with the commit
        id: check
        run: |
          set -uo pipefail
          drift=false
          broken=false
          for script in scripts/vendor/owasp-*.sh; do
            status=0
            bash "$script" --check >> vendor-check.txt 2>&1 || status=$?
            # 0 matches, 1 a sum, a tag or the tree differs, 2 a fetch failed.
            case "$status" in
              0) ;;
              1) drift=true ;;
              *) broken=true ;;
            esac
          done
          cat vendor-check.txt
          if [ "$broken" = true ]; then
            echo "a vendored tree could not be fetched; the comparison is incomplete" >&2
            exit 1
          fi
          echo "drift=$drift" >> "$GITHUB_OUTPUT"

      - name: Open an issue when a vendored copy drifted
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: A vendored OWASP document no longer matches its pinned upstream
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          open="$(gh issue list --state open --limit 500 --json title \
            --jq "[.[] | select(.title == \"$TITLE\")] | length")"
          if [ "$open" -ne 0 ]; then
            echo "an open issue already carries this report; not opening a second"
            exit 0
          fi
          {
            echo "A \`scripts/vendor/owasp-*.sh --check\` run found a vendored tree that differs from its pin."
            echo
            echo "Re-resolve the tag and commit with \`gh api\`, update the script and \`docs/VERSIONS.md\` (see Updating in \`docs/security/README.md\`), and re-run it."
            echo
            echo '```text'
            cat vendor-check.txt
            echo '```'
            echo
            echo "Reported by [this run]($RUN_URL)."
          } > body.md
          bash scripts/gh/fields.sh new task low low \
            --title "$TITLE" --body-file body.md --label documentation --label security

  # The eduLIMS-lab operational template against the CKM archetypes it pins:
  # scripts/openehr/build-opt.py --check fetches each archetype at its pinned
  # revision and build_uid, rebuilds the OPT and diffs it with the committed
  # docker/ferroehr/definitions/eduLIMS-lab.v1.opt (#245). A difference is a
  # hand edit or a changed archetype behind a pin, a broken input rather than
  # a newer release, so the job fails as well as opening one issue. The
  # archetypes are not vendored, so no offline check exists for pull requests
  # and this job is the guard.
  template-opt:
    name: eduLIMS-lab template against CKM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rebuild the OPT from CKM and diff it with the commit
        id: check
        run: |
          set -uo pipefail
          status=0
          python3 -I scripts/openehr/build-opt.py --check > opt-check.txt 2>&1 || status=$?
          cat opt-check.txt
          # 0 matches, 1 a pin or the committed file differs, 2 a fetch failed.
          case "$status" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drift=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "an archetype could not be fetched; the comparison is incomplete" >&2
              exit 1
              ;;
          esac

      - name: Open an issue when the template drifted
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: The eduLIMS-lab template no longer matches its pinned CKM archetypes
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          open="$(gh issue list --state open --limit 500 --json title \
            --jq "[.[] | select(.title == \"$TITLE\")] | length")"
          if [ "$open" -ne 0 ]; then
            echo "an open issue already carries this report; not opening a second"
            exit 0
          fi
          {
            echo "\`python3 -I scripts/openehr/build-opt.py --check\` found that the committed \`docker/ferroehr/definitions/eduLIMS-lab.v1.opt\` differs from the build, or that a CKM archetype no longer matches its pin."
            echo
            echo "Rebuild the OPT to revert a hand edit. A changed archetype means a new template id beside the old one (\`docs/deployment.md\`, \"Templates\")."
            echo
            echo '```text'
            cat opt-check.txt
            echo '```'
            echo
            echo "Reported by [this run]($RUN_URL)."
          } > body.md
          bash scripts/gh/fields.sh new task low low \
            --title "$TITLE" --body-file body.md --label openehr

      - name: Fail on a difference
        if: steps.check.outputs.drift == 'true'
        run: |
          echo "the eduLIMS-lab template differs from its pinned CKM archetypes" >&2
          exit 1
