# Release image (reusable): one eduLIMS container image for linux/amd64 and
# linux/arm64, pushed to GHCR by digest with SLSA provenance and SBOM
# attestations. release.yml calls it twice from the same docker/Dockerfile:
#
#   edulims          the `runtime` target, from the `.output/` tarball that
#                    release-build.yml built and attested in this run. The
#                    tarball's attestation is verified against that lane's
#                    identity before it enters the build context, so the
#                    image's provenance chains to an attested input.
#   edulims-migrate  the `tools` target (the host CLI, migrations by default),
#                    built from the tagged source.
#
# A reusable workflow for the reason release-build.yml is one: SLSA Build L3
# keeps the signing identity out of reach of caller-defined steps
# (https://docs.github.com/actions/security-guides/using-artifact-attestations-and-reusable-workflows-to-achieve-slsa-v1-build-level-3).
#
# What lands in the registry for one release:
#   - the image index, pushed by digest with no tag. scan-and-tag.yml tags it
#     <version>, <major>.<minor> and latest once its scan and the release's
#     vulnerability record pass;
#   - BuildKit's SLSA provenance (mode=max) as attestation manifests in the
#     index (the unknown/unknown entries GHCR lists);
#   - GitHub attestations pushed to the registry: provenance for the index and
#     for each platform manifest, and an SPDX SBOM per platform manifest.
#
# Verify a published image:
#   gh attestation verify oci://ghcr.io/vernum-projecten/edulims:<version> \
#     --repo Vernum-Projecten/eduLIMS \
#     --signer-workflow Vernum-Projecten/eduLIMS/.github/workflows/release-image.yml
name: Release image (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag being released.
        required: true
        type: string
      sha:
        description: The commit the tag points at.
        required: true
        type: string
      name:
        description: The image name under ghcr.io/vernum-projecten.
        required: true
        type: string
      target:
        description: The docker/Dockerfile target to build (runtime or tools).
        required: true
        type: string
      from-tarball:
        description: >-
          Build from the attested `.output/` tarball of release-build.yml
          (OUTPUT=dist) rather than from source.
        required: false
        type: boolean
        default: false
      title:
        description: The image title, for the OCI labels and annotations.
        required: true
        type: string
      description:
        description: The image description, for the OCI labels and annotations.
        required: true
        type: string
    outputs:
      digest:
        description: The digest of the pushed image index.
        value: ${{ jobs.image.outputs.digest }}
      tags:
        description: >-
          The newline-separated tags scan-and-tag.yml applies to the digest
          once the scan and the vulnerability record pass.
        value: ${{ jobs.image.outputs.tags }}

permissions: {}

env:
  # GHCR names are lower case; the owner is written out, not derived, so a
  # renamed organisation cannot move where the images go.
  IMAGE: ghcr.io/vernum-projecten/${{ inputs.name }}
  # Annotate the index as well as the manifests: GHCR reads the package
  # description from the index
  # (https://docs.docker.com/build/ci/github-actions/annotations/).
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read # the attestations API, to verify the tarball
      packages: write # push the image and its attestations to GHCR
      id-token: write # Sigstore, for the provenance and SBOM attestations
      attestations: write # store them against this repository
      artifact-metadata: write # storage records for the linked artifacts page (https://docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/use-artifact-attestations)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}

      - name: Download the attested tarball
        if: ${{ inputs.from-tarball }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edulims-${{ inputs.tag }}
          path: tarball

      # Refuse an input the build lane did not attest: the image's provenance
      # is only as good as the tree it copies.
      - name: Verify the tarball against the build lane's identity and stage it
        if: ${{ inputs.from-tarball }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tarball="tarball/edulims-${TAG}.tar.gz"
          gh attestation verify "$tarball" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-build.yml"
          bash scripts/release/output.sh stage "$tarball"

      - name: Select the build input
        id: input
        env:
          FROM_TARBALL: ${{ inputs.from-tarball }}
        run: |
          if [ "$FROM_TARBALL" = "true" ]; then
            echo "output=dist" >> "$GITHUB_OUTPUT"
          else
            echo "output=source" >> "$GITHUB_OUTPUT"
          fi

      # Every stage that runs code runs on the runner's own platform (the
      # Dockerfile's header says why), so buildx needs no QEMU.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags: the version, its major.minor, and latest, which the action
      # leaves out for a pre-release. Tags on GHCR are mutable; the attested
      # digest is what `gh attestation verify` checks (docs/release.md).
      - name: Image tags, labels, and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
          labels: |
            org.opencontainers.image.title=${{ inputs.title }}
            org.opencontainers.image.description=${{ inputs.description }}
            org.opencontainers.image.vendor=Ruben Talstra
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=${{ inputs.title }}
            org.opencontainers.image.description=${{ inputs.description }}
            org.opencontainers.image.vendor=Ruben Talstra
            org.opencontainers.image.licenses=Apache-2.0

      # Cold by construction: no cache may influence a published artifact.
      # BuildKit's SBOM scanner is off; the syft scan below is the one SBOM
      # source. BuildKit provenance stays on at mode=max.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ inputs.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            OUTPUT=${{ steps.input.outputs.output }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ inputs.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            PROVENANCE=oci://${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          pull: true
          provenance: mode=max
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Resolve the platform manifests
        id: manifests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          index="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw)"
          amd64="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"$index")"
          arm64="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<<"$index")"
          case "$amd64" in sha256:*) ;; *) echo "::error::no linux/amd64 manifest in ${DIGEST}"; exit 1 ;; esac
          case "$arm64" in sha256:*) ;; *) echo "::error::no linux/arm64 manifest in ${DIGEST}"; exit 1 ;; esac
          {
            echo "amd64=${amd64}"
            echo "arm64=${arm64}"
          } >> "$GITHUB_OUTPUT"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Generate one SBOM per platform
        env:
          TAG: ${{ inputs.tag }}
          NAME: ${{ inputs.name }}
          AMD64: ${{ steps.manifests.outputs.amd64 }}
          ARM64: ${{ steps.manifests.outputs.arm64 }}
        run: |
          set -euo pipefail
          syft scan "registry:${IMAGE}@${AMD64}" --platform linux/amd64 -o "spdx-json=${NAME}-${TAG}-image-amd64.spdx.json"
          syft scan "registry:${IMAGE}@${ARM64}" --platform linux/arm64 -o "spdx-json=${NAME}-${TAG}-image-arm64.spdx.json"
          for f in "${NAME}-${TAG}"-image-*.spdx.json; do
            jq -e '.packages | length > 1' "$f" > /dev/null || {
              echo "::error::${f} lists no packages"
              exit 1
            }
          done

      # `push-to-registry` stores each bundle in GHCR next to its subject, so
      # `gh attestation verify --bundle-from-oci` and registry-side policy
      # find it as well as the attestations API.
      - name: Attest the index provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest the linux/amd64 provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.amd64 }}
          push-to-registry: true
      - name: Attest the linux/amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.amd64 }}
          sbom-path: ${{ inputs.name }}-${{ inputs.tag }}-image-amd64.spdx.json
          push-to-registry: true
      - name: Attest the linux/arm64 provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.arm64 }}
          push-to-registry: true
      - name: Attest the linux/arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifests.outputs.arm64 }}
          sbom-path: ${{ inputs.name }}-${{ inputs.tag }}-image-arm64.spdx.json
          push-to-registry: true

      # The lane checks its output the way a consumer would, so a broken
      # attestation fails the release and not the first deployment.
      - name: Verify the pushed image as a consumer
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.manifests.outputs.amd64 }}
          ARM64: ${{ steps.manifests.outputs.arm64 }}
        run: |
          set -euo pipefail
          signer="${GITHUB_REPOSITORY}/.github/workflows/release-image.yml"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer"
          for manifest in "$AMD64" "$ARM64"; do
            gh attestation verify "oci://${IMAGE}@${manifest}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer"
            gh attestation verify "oci://${IMAGE}@${manifest}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer" \
              --predicate-type https://spdx.dev/Document/v2.3
          done
          {
            echo "### ${IMAGE}"
            echo
            echo "| | digest |"
            echo "|---|---|"
            echo "| index | \`${DIGEST}\` |"
            echo "| linux/amd64 | \`${AMD64}\` |"
            echo "| linux/arm64 | \`${ARM64}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
