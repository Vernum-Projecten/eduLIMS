# SPDX-FileCopyrightText: Ruben Talstra
# SPDX-License-Identifier: Apache-2.0
#
# REUSE Specification 3.3: https://reuse.software/spec-3.3/
#
# Hand-written files carry their own SPDX header. This file covers what cannot
# carry one (generated files, lockfiles, images, tool exports) and the
# third-party code that is copied into the tree.
#
# Order matters: when several tables match a file, the LAST matching table
# wins (spec 3.3). The first table is the catch-all; later tables narrow it.
# First-party globs use `closest`, so a file's own header takes precedence.

version = 1

# Catch-all: the project's own work.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "Ruben Talstra"
SPDX-License-Identifier = "Apache-2.0"

# Generated by TanStack Router from src/routes/. Regenerated on every build.
[[annotations]]
path = "src/routeTree.gen.ts"
precedence = "override"
SPDX-FileCopyrightText = "Ruben Talstra"
SPDX-License-Identifier = "Apache-2.0"

# shadcn/ui components, generated from the shadcn registry (MIT) and then
# owned and edited in this repository.
[[annotations]]
path = "src/components/ui/**"
precedence = "closest"
SPDX-FileCopyrightText = ["shadcn", "Ruben Talstra"]
SPDX-License-Identifier = "MIT"

# Machine-written lockfile and tool configuration without comment syntax.
[[annotations]]
path = [
  "pnpm-lock.yaml",
  "package.json",
  "components.json",
  "tsconfig.json",
  "biome.json",
  ".node-version",
  ".npmrc",
  ".idea/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "Ruben Talstra"
SPDX-License-Identifier = "Apache-2.0"

# Images and diagram sources.
[[annotations]]
path = [
  "**/*.png",
  "**/*.jpg",
  "**/*.svg",
  "**/*.ico",
  "**/*.webp",
  "**/*.drawio",
]
precedence = "closest"
SPDX-FileCopyrightText = "Ruben Talstra"
SPDX-License-Identifier = "Apache-2.0"

# The brand rasters (assets/brand/README.md) and their served copies in the app's
# public/ and the documentation site's website/public/. The wordmark and the social
# card's lettering are Space Grotesk 2.000 (SIL OFL 1.1, the Space Grotesk Project
# Authors) outlined to paths: artwork made with the font, not the font software, so
# the files carry the repository's licence. The SVGs carry their own SPDX comment.
[[annotations]]
path = [
  "assets/brand/*.png",
  "assets/brand/*.ico",
  "public/*.png",
  "public/*.ico",
  "public/manifest.webmanifest",
  "website/public/*.png",
  "website/public/*.ico",
]
precedence = "closest"
SPDX-FileCopyrightText = "Ruben Talstra"
SPDX-License-Identifier = "Apache-2.0"

# Test fixtures: pseudonymised, made-up data only.
[[annotations]]
path = ["tests/fixtures/**", "test/fixtures/**"]
precedence = "closest"
SPDX-FileCopyrightText = "Ruben Talstra"
SPDX-License-Identifier = "Apache-2.0"

# The Citation File Format 1.2.0 JSON Schema and its licence, vendored for the
# citation check (scripts/checks/citation.sh). Upstream, commit and sha256 are
# in .github/cff-schema/PROVENANCE.md, which is first-party.
[[annotations]]
path = [".github/cff-schema/schema.json", ".github/cff-schema/LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "The Citation File Format contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The OWASP standards and cheat sheets, vendored byte for byte by
# scripts/vendor/owasp-*.sh. Upstream, tag, commit and sha256 of every file are
# in each tree's PROVENANCE.md; the upstream licence file sits beside them.
[[annotations]]
path = "docs/security/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "The OWASP Foundation, Inc. and the OWASP project contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The PROVENANCE.md files the fetch scripts write are the project's own.
[[annotations]]
path = "docs/security/vendor/*/PROVENANCE.md"
precedence = "override"
SPDX-FileCopyrightText = "Ruben Talstra"
SPDX-License-Identifier = "Apache-2.0"

# The Abbott Afinion 2 documents, kept unmodified for reference (#209); their
# source and sha256 are in docs/vendor/afinion/PROVENANCE.md.
[[annotations]]
path = "docs/vendor/afinion/*.pdf"
precedence = "override"
SPDX-FileCopyrightText = "Abbott"
SPDX-License-Identifier = "LicenseRef-Abbott-All-Rights-Reserved"

# The eduLIMS-lab operational templates, built by scripts/openehr/build-opt.py
# from openEHR CKM archetypes (CC-BY-SA 4.0); a template is a derived work and
# carries the archetypes' licence (#146).
[[annotations]]
path = "docker/ferroehr/definitions/*.opt"
precedence = "override"
SPDX-FileCopyrightText = ["openEHR Foundation", "Ruben Talstra"]
SPDX-License-Identifier = "CC-BY-SA-4.0"
