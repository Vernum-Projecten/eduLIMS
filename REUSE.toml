# SPDX-FileCopyrightText: Ruben Talstra
# SPDX-License-Identifier: Apache-2.0
#
# REUSE Specification 3.3: https://reuse.software/spec-3.3/
#
# Hand-written files carry their own SPDX header. This file covers what cannot
# carry one (generated files, lockfiles, images, tool exports) and the
# third-party code that is copied into the tree.
#
# Order matters: when several tables match a file, the LAST matching table
# wins (spec 3.3). The first table is the catch-all; later tables narrow it.
# First-party globs use `closest`, so a file's own header takes precedence.

version = 1

# Catch-all: the project's own work.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "Ruben Talstra"
SPDX-License-Identifier = "Apache-2.0"

# Generated by TanStack Router from src/routes/. Regenerated on every build.
[[annotations]]
path = "src/routeTree.gen.ts"
precedence = "override"
SPDX-FileCopyrightText = "Ruben Talstra"
SPDX-License-Identifier = "Apache-2.0"

# shadcn/ui components, generated from the shadcn registry (MIT) and then
# owned and edited in this repository.
[[annotations]]
path = "src/components/ui/**"
precedence = "closest"
SPDX-FileCopyrightText = ["shadcn", "Ruben Talstra"]
SPDX-License-Identifier = "MIT"

# Machine-written lockfile and tool configuration without comment syntax.
[[annotations]]
path = [
  "pnpm-lock.yaml",
  "package.json",
  "components.json",
  "tsconfig.json",
  "biome.json",
  ".node-version",
  ".npmrc",
  "CITATION.cff",
  ".idea/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "Ruben Talstra"
SPDX-License-Identifier = "Apache-2.0"

# Images, the ArchiMate model and diagram sources.
[[annotations]]
path = [
  "**/*.png",
  "**/*.jpg",
  "**/*.svg",
  "**/*.ico",
  "**/*.webp",
  "**/*.drawio",
  "docs/architecture/eduLIMS_novius.xml",
]
precedence = "closest"
SPDX-FileCopyrightText = "Ruben Talstra"
SPDX-License-Identifier = "Apache-2.0"

# Test fixtures: pseudonymised, made-up data only.
[[annotations]]
path = ["tests/fixtures/**", "test/fixtures/**"]
precedence = "closest"
SPDX-FileCopyrightText = "Ruben Talstra"
SPDX-License-Identifier = "Apache-2.0"
