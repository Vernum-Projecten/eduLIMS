#
# What `pnpm dev` needs on a developer machine: PostgreSQL 18 with the eduLIMS
# database (plus `edulims_test` and `edulims_e2e`, beside which every
# `pnpm test` and `pnpm test:e2e` run creates its own database), and Keycloak with a ready `edulims` realm, so sign-in
# works without a Microsoft Entra ID app registration. eduLIMS itself runs on
# the host with `pnpm dev`, so it reloads on every save.
#
#   pnpm dev:db                     # podman compose (or docker compose) -f compose.dev.yaml up -d --wait
#   cp .env.example .env            # the dev values below are already in it
#   pnpm db:migrate
#   pnpm db:seed
#   pnpm dev
#
# Keycloak:  http://localhost:8180 (admin console: admin / admin)
#            issuer http://localhost:8180/realms/edulims
#            users student / student, teacher / teacher, admin / admin
#
# With FerroEHR and FerroBRIDGE beside it (profile `ferro`), for work on the
# integrations and the integration status of the Admin portal (B3):
#
#   pnpm dev:db:ferro               # the stack above plus FerroEHR (:8080) and FerroBRIDGE (:8081)
#
# Both run from the images compose.yaml pins, configured by environment only:
# no config files, no authentication, loopback ports.
#
# The development credentials below are fixed and public, and the ports bind
# the loopback interface only. Never point this file at real data.
#
# No mail catcher: sign-in goes through Keycloak, Entra ID or the
# EDULIMS_DEV_LOGIN shortcut, and eduLIMS sends no mail.

name: edulims-dev

services:
  postgres:
    # The FerroEHR PostgreSQL image, as in compose.yaml, so a dev database has
    # the same server version and the same databases as production.
    image: ghcr.io/ferrohealth/ferroehr-postgres:5.7.0@sha256:3b7dbfce603b4ff3c8a29366655f195baf2bfeaf903a1bf1be851ba69293743a
    # Room for several test and e2e runs at once, each with its own database
    # and pool (the default of 100 runs out near five). It takes effect when
    # the container is recreated.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_PASSWORD: postgres
      PG_INIT_USER: ferroehr
      PG_INIT_PASSWORD: ferroehr
      PG_INIT_DB: ferroehr
      EDULIMS_DB_USER: edulims
      EDULIMS_DB_PASSWORD: edulims
      EDULIMS_DB_NAME: edulims
      # The read-only role the Postgres MCP server connects as
      # (EDULIMS_MCP_PG* in .env.example). Development only: compose.yaml
      # creates no such role.
      EDULIMS_READONLY_USER: edulims_readonly
      EDULIMS_READONLY_PASSWORD: edulims_readonly
    ports:
      - "127.0.0.1:${EDULIMS_DEV_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init/20-edulims.sh:/docker-entrypoint-initdb.d/20-edulims.sh:ro
      # The test base databases and CREATEDB, so each test run makes its own.
      - ./docker/postgres/init/30-edulims-test-databases.sh:/docker-entrypoint-initdb.d/30-edulims-test-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Keycloak in development mode on its built-in dev-file database, with the
  # realm imported from docker/keycloak/edulims-realm.json at every start
  # (an existing realm is kept). The realm file is the whole state that
  # matters, so a Keycloak database in PostgreSQL would only add a role to
  # create and a schema to migrate. To load a changed realm file, recreate
  # the container: `docker compose -f compose.dev.yaml up -d --force-recreate keycloak`.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One issuer for the browser and for `pnpm dev` on the host: both reach
      # Keycloak at this URL, so every token's `iss` matches KEYCLOAK_ISSUER.
      KC_HOSTNAME: http://localhost:${EDULIMS_DEV_KEYCLOAK_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${EDULIMS_DEV_KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./docker/keycloak/edulims-realm.json:/opt/keycloak/data/import/edulims-realm.json:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # The image ships bash and no HTTP client, so the probe reads the realm's
    # discovery document over bash's /dev/tcp: healthy means the realm is
    # imported and the listener answers.
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /realms/edulims/.well-known/openid-configuration HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '^HTTP/1.1 200' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # FerroEHR in development: the record subject index in the instance and no
  # authentication, so it starts without config/ferroehr.toml. Production
  # (compose.yaml) reads its configuration file and requires authentication.
  ferroehr:
    profiles: [ferro]
    image: ghcr.io/ferrohealth/ferroehr:5.7.0@sha256:44c9268cb8a154df118a10ffe84329633f22923ea2cc54261ff0cea57a2ee7e7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FERROEHR__DATABASE__URL: postgres://ferroehr:ferroehr@postgres:5432/ferroehr
      FERROEHR__RECORD__SUBJECT_INDEX: local
      FERROEHR__AUTH__ENABLED: "false"
      FERROEHR__TELEMETRY__FORMAT: pretty
      FERROEHR__USAGE_REPORT__ENABLED: "false"
    ports:
      - "127.0.0.1:${EDULIMS_DEV_FERROEHR_PORT:-8080}:8080"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroehr", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # FerroBRIDGE in development: its HTTP API with the health endpoint the
  # integration status checks (GET /health/readiness). The HL7 v2 listener
  # stays off; it needs the [hl7v2] configuration of docs/deployment.md.
  ferrobridge:
    profiles: [ferro]
    image: ghcr.io/ferrohealth/ferrobridge:0.0.24@sha256:6e14c783955da9ecd5683fbe781542580e2ebae18d0f4c07e888a1c086e05e59
    depends_on:
      ferroehr:
        condition: service_healthy
    environment:
      FERROBRIDGE__TELEMETRY__FORMAT: auto
      FERROBRIDGE__USAGE_REPORT__ENABLED: "false"
    ports:
      - "127.0.0.1:${EDULIMS_DEV_FERROBRIDGE_PORT:-8081}:8080"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferrobridge", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  pgdata:
